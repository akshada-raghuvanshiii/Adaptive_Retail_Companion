# ARC laptop <-> Raspberry Pi link. Same file on both machines (deploy.sh copies it to the Pi).
#
# LINK=hotspot  both machines join the same phone hotspot (Wi-Fi). The phone hands out addresses, so
#               nothing is fixed here: each machine uses whatever Wi-Fi address it has, and finds the
#               other by name (mDNS: PI_HOST below, LAPTOP_HOST written by deploy.sh).
# LINK=cable    direct Ethernet cable with the static addresses below (no hotspot needed).
LINK=hotspot
PI_USER=arc                  # login name on the Pi (set when flashing the SD card)
PI_HOST=arc-pi.local         # how the laptop reaches the Pi: mDNS name, or its IP (phone: hotspot > connected devices)
# LAPTOP_HOST is written to hil.peer on the Pi by deploy.sh (the laptop's own name + .local)
# Cable only:
LAPTOP_IP=192.168.50.1
PI_IP=192.168.50.2
PREFIX=24
# Where things are on the LAPTOP (deploy.sh copies them to ~/arc_pi_run on the Pi)
PERCEPTION_DIR=$HOME/arc-perception
HW_DIR=$HOME/arc_hw
WEIGHTS=$HOME/arc_perception/yolov8n.pt
# Motor bridge settings: fill in after bench.py calibrate (see arc_hw/README.md)
WHEEL_D=0.10                 # wheel diameter, m
TRACK=0.40                   # wheel centre-to-centre, m
PPR=8                        # Hall pulses (magnets) per wheel revolution
PWM_MIN=60
FF=0.6
MAX_WHEEL=300                # wheel speed limit, mm/s
SERIAL_PORT=/dev/ttyACM0
# Camera on the Pi
CAMERA=0
CAM_W=640
CAM_H=480
IMGSZ=320                    # YOLO input size on the Pi (320 is lighter than the laptop's 416)
# Optional faster model on the Pi, made by: pi_perf.py --export-ncnn  (must match IMGSZ it was exported at)
# PI_MODEL=$HOME/arc_pi_run/arc-perception/yolov8n_ncnn_model
